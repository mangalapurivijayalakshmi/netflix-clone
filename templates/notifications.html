{% load static %}

<!DOCTYPE html>
<html>
<head>

    <title>Notifications</title>

    <link rel="stylesheet" href="{% static 'assets/style.css' %}">

</head>

<body>
<button id="theme-toggle" onclick="toggleTheme()" style="background:none;border:1px solid var(--text-color);color:var(--text-color);padding:6px 12px;border-radius:20px;cursor:pointer;">🌙</button>
<h1 style="color:var(--text-color);text-align:center;">
    🔔 Notifications
</h1>

{% for notification in notifications %}

<div style="background:var(--card-bg);
            color:var(--text-color);
            margin:20px;
            padding:20px;
            border-radius:10px;">

    <p>{{ notification.message }}</p>

    <small>
        {{ notification.created_at }}
    </small>

</div>

{% empty %}

<h3 style="color:var(--text-color);text-align:center;">
    No Notifications
</h3>

{% endfor %}
<script>
    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        document.getElementById('theme-toggle').innerText = theme === 'light' ? '☀️' : '🌙';
    }
    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme') || 'dark';
        const newTheme = current === 'light' ? 'dark' : 'light';
        localStorage.setItem('theme', newTheme);
        applyTheme(newTheme);
    }
    const savedTheme = localStorage.getItem('theme') || 'dark';
    applyTheme(savedTheme);
</script>
</body>

</html>
