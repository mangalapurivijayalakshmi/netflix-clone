{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Later</title>

    <link rel="stylesheet" href="{% static 'assets/style.css' %}">
</head>
<body>

<header>
    <div>
        <a href="{% url 'index' %}">Home</a>
        <a href="{% url 'my_list' %}">My List</a>
        <a href="{% url 'favorites' %}">Favorites</a>
        <a href="{% url 'history' %}">History</a>
        <a href="{% url 'profile' %}">Profile</a>
        <a href="{% url 'logout' %}">Logout</a>
        <button id="theme-toggle" onclick="toggleTheme()" style="background:none;border:1px solid var(--text-color);color:var(--text-color);padding:6px 12px;border-radius:20px;cursor:pointer;">🌙</button>
    </div>
</header>

<section style="padding:30px;">

<h1>⏰ Watch Later</h1>

<div class="movie-grid">

{% for item in watch_later_movies %}

<div class="film-card"
     onclick="window.location.href='{% url 'movie' item.movie.uu_id %}'"
     style="background-image:url('{{ item.movie.image_card.url }}');">

    <div class="hover-content">

        <h3>{{ item.movie.title }}</h3>

        <p>⭐ {{ item.movie.rating }}</p>

    </div>

</div>

{% empty %}

<h2>No movies added to Watch Later.</h2>

{% endfor %}

</div>

</section>
<script>
    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        document.getElementById('theme-toggle').innerText = theme === 'light' ? '☀️' : '🌙';
    }
    function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme') || 'dark';
        const newTheme = current === 'light' ? 'dark' : 'light';
        localStorage.setItem('theme', newTheme);
        applyTheme(newTheme);
    }
    const savedTheme = localStorage.getItem('theme') || 'dark';
    applyTheme(savedTheme);
</script>
</body>
</html>
